[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-requirements-agent"
version = "0.1.0"
description = "RAG-grounded backend that turns software requirement documents into validated engineering artefacts (requirements, user stories, entities, API specs, test cases)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Unmesh Pawar" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "email-validator>=2.1,<3.0",
  "sqlalchemy[asyncio]>=2.0.30,<2.2",
  "asyncpg>=0.29,<1.0",
  "aiosqlite>=0.20,<1.0",
  "alembic>=1.13,<2.0",
  "pgvector>=0.3,<1.0",
  "numpy>=1.26,<3.0",
  "httpx>=0.27,<1.0",
  "tenacity>=8.2,<10.0",
  "PyJWT>=2.8,<3.0",
  "bcrypt>=4.1,<6.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.2,<7.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40,<3.0"]
anthropic = ["anthropic>=0.34,<1.0"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "asgi-lifespan>=2.1",
  "openapi-spec-validator>=0.7",
  "ruff>=0.6",
]

[project.scripts]
requirements-agent = "requirements_agent.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/requirements_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ASYNC", "S", "RUF", "C4", "PT", "RET"]
ignore = [
  "B008",   # FastAPI dependency injection uses calls in defaults
  "S101",   # assert is fine in tests (and used for invariants)
  "RUF012", # mutable class attributes on SQLAlchemy / pydantic models are intentional
  "UP046",  # pydantic generic models keep Generic[T] for clarity
  "UP047",
  "ASYNC109", # explicit timeout parameters on shutdown helpers are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "N802", "PT018"]
"src/requirements_agent/db/migrations/**" = ["N999"]
"scripts/**" = ["E402", "ASYNC240", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["requirements_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "postgres: tests that need a real PostgreSQL + pgvector database (set TEST_DATABASE_URL)",
]
filterwarnings = [
  "ignore::DeprecationWarning:docx.*",
]

[tool.coverage.run]
source = ["requirements_agent"]
branch = true
# SQLAlchemy's asyncio layer switches greenlets; without this, lines after awaits are missed.
concurrency = ["greenlet", "thread"]
omit = [
  "src/requirements_agent/db/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.$",
]
